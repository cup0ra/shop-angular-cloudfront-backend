openapi: 3.0.3
info:
  title: Product Service API
  version: 1.0.0
  description: API documentation for Product Service endpoints used by the storefront PLP and PDP.
servers:
  - url: https://nes5rvdgle.execute-api.us-east-1.amazonaws.com/dev
    description: Dev environment
  - url: https://awoacy0dc5.execute-api.us-east-1.amazonaws.com/prod
    description: Prod environment
tags:
  - name: Products
    description: Product Service endpoints
paths:
  /products:
    get:
      tags:
        - Products
      summary: Get products list
      operationId: getProductsList
      description: Returns the full array of products with stock counts for the Product List Page.
      responses:
        '200':
          description: Products list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              examples:
                default:
                  value:
                    - id: 7567ec4b-b10c-48c5-9345-fc73c48a80aa
                      title: ProductOne
                      description: Short Product Description1
                      price: 2
                      count: 4
                    - id: 7567ec4b-b10c-48c5-9345-fc73c48a80ab
                      title: ProductNew
                      description: Short Product Description3
                      price: 10
                      count: 6
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      description: Creates a new product and its stock record in a single DynamoDB transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              title: New Product
              description: A great product
              price: 15
              count: 10
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 7567ec4b-b10c-48c5-9345-fc73c48a80ac
                title: New Product
                description: A great product
                price: 15
                count: 10
        '400':
          description: Invalid or missing request body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                missingBody:
                  summary: No body provided
                  value:
                    message: Product data is required
                invalidJson:
                  summary: Malformed JSON
                  value:
                    message: Invalid JSON body
                validationError:
                  summary: Schema validation failed
                  value:
                    message: Invalid product data
                    errors:
                      - code: too_small
                        minimum: 1
                        type: string
                        inclusive: true
                        exact: false
                        message: String must contain at least 1 character(s)
                        path:
                          - title
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by id
      operationId: getProductsById
      description: Returns a single product by identifier for the Product Details Page.
      parameters:
        - name: id
          in: path
          required: true
          description: Product identifier.
          schema:
            type: string
      responses:
        '200':
          description: Product returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Missing product id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Product id is required
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Product not found
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - title
        - description
        - price
        - count
      properties:
        id:
          type: string
          example: 7567ec4b-b10c-48c5-9345-fc73c48a80aa
        title:
          type: string
          example: ProductOne
        description:
          type: string
          example: Short Product Description1
        price:
          type: integer
          example: 2
        count:
          type: integer
          example: 4
    CreateProductRequest:
      type: object
      required:
        - title
        - description
        - price
        - count
      properties:
        title:
          type: string
          minLength: 1
          example: ProductOne
        description:
          type: string
          minLength: 1
          example: Short Product Description1
        price:
          type: integer
          minimum: 1
          example: 2
        count:
          type: integer
          minimum: 0
          example: 4
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Product not found
    ValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: Invalid product data
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              path:
                type: array
                items:
                  type: string
